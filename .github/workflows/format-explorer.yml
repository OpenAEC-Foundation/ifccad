name: CAD Format Explorer CI and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR updates replace their own checks without interrupting a main deployment.
  group: ${{ github.event_name == 'pull_request' && format('format-explorer-pr-{0}', github.event.pull_request.number) || 'format-explorer-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: format-explorer/wasm-build
          key: ifccad-browser-wasm-ubuntu24-v3-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'src/**/*.rs', 'crates/**/src/**/*.rs', 'schemas/**', 'crates/ifccad-convert/README.md', 'scripts/check_explorer_dependencies.py', 'patches/opencadcodec-viewports*', 'patches/opencadcodec-viewports/**', 'patches/opencadcodec-dimension/**', 'patches/opencadcodec-polyline-widths/**', '.github/actions/viewport-codec/**') }}
      - uses: ./.github/actions/viewport-codec
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Install the WebAssembly C compiler for Zstd
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang
      - uses: taiki-e/install-action@v2
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          tool: wasm-pack
      - name: Check Explorer dependency boundary
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          python3 scripts/check_explorer_dependencies.py
      - name: Build browser processor
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: wasm-pack build crates/browser --target web --out-dir ../../format-explorer/wasm-build --release
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify browser processor
        run: |
          test -s format-explorer/wasm-build/browser.js
          test -s format-explorer/wasm-build/browser_bg.wasm
          node format-explorer/tests/wasm-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-wasm
          path: format-explorer/wasm-build/
          retention-days: 7

  ocs:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/cache@v4
        id: web-cache
        with:
          path: ocs-upstream/dist/app
          key: ocs-web-main-aedf475c-linux-trunk
      - uses: actions/checkout@v5
        if: steps.web-cache.outputs.cache-hit != 'true'
        with:
          repository: HakanSeven12/OpenCADStudio
          ref: aedf475c97463213bd654ae96da8454eb0d7aac9
          path: ocs-upstream
      - uses: dtolnay/rust-toolchain@stable
        if: steps.web-cache.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.web-cache.outputs.cache-hit != 'true'
        with:
          workspaces: ocs-upstream
      - uses: taiki-e/install-action@v2
        if: steps.web-cache.outputs.cache-hit != 'true'
        with:
          tool: trunk
      - name: Read pinned wasm-bindgen version
        if: steps.web-cache.outputs.cache-hit != 'true'
        id: wasm-bindgen-version
        working-directory: ocs-upstream
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        if: steps.web-cache.outputs.cache-hit != 'true'
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}
      - name: Build pinned web viewer
        if: steps.web-cache.outputs.cache-hit != 'true'
        working-directory: ocs-upstream
        run: trunk build --locked --release --public-url /ocs/app/ --dist dist/app --html-output index.html web-app.html
      - name: Complete the self-hosted viewer bundle
        if: steps.web-cache.outputs.cache-hit != 'true'
        run: |
          cp ocs-upstream/LICENSE ocs-upstream/dist/app/LICENSE
          printf '[]\n' > ocs-upstream/dist/app/supporters.json
      - name: Verify reused or built viewer
        run: |
          test -s ocs-upstream/dist/app/index.html
          test -n "$(find ocs-upstream/dist/app -name '*.wasm' -print -quit)"
          test -s ocs-upstream/dist/app/LICENSE
          test -s ocs-upstream/dist/app/supporters.json
      - uses: actions/upload-artifact@v4
        with:
          name: ocs-web-main-aedf475c
          path: ocs-upstream/dist/app/
          retention-days: 7

  checks:
    runs-on: ubuntu-24.04
    container: rust:bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install cache tool
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends zstd python3
      - uses: actions/cache@v4
        id: rust-checks-cache
        with:
          path: target/explorer-rust-checks-passed
          key: ifccad-rust-checks-debian12-v4-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'scripts/check_active_workspace.py', 'scripts/tests/test_active_workspace.py', 'crates/**', 'src/**', 'tests/**', 'schemas/**', 'conformance/**', 'examples/**', 'scripts/check_explorer_dependencies.py', 'patches/opencadcodec-viewports*', 'patches/opencadcodec-viewports/**', 'patches/opencadcodec-dimension/**', 'patches/opencadcodec-polyline-widths/**', '.github/actions/viewport-codec/**', '.github/workflows/format-explorer.yml') }}
      - uses: ./.github/actions/viewport-codec
        if: steps.rust-checks-cache.outputs.cache-hit != 'true'
      - name: Install Rust check tools
        if: steps.rust-checks-cache.outputs.cache-hit != 'true'
        run: rustup component add rustfmt clippy
      - name: Cache Rust check dependencies
        if: steps.rust-checks-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: 'false'
      - name: Check Rust workspace
        if: steps.rust-checks-cache.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          python3 scripts/check_explorer_dependencies.py
          python3 scripts/check_active_workspace.py
          python3 -m unittest discover -s scripts/tests -p test_active_workspace.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo clippy -p ifccad --all-targets --features ifccad-cbor-zstd -- -D warnings
          cargo test -p ifccad --features ifccad-cbor-zstd --test ifccad_cbor_zstd
      - name: Record passing Rust checks
        if: steps.rust-checks-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p target
          printf '%s\n' "$GITHUB_SHA" > target/explorer-rust-checks-passed

  build:
    needs: [ocs, browser-wasm]
    runs-on: ubuntu-24.04
    # Match the existing Node 22 / Debian 12 production container's libc.
    container: rust:bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ocs-web-main-aedf475c
          path: format-explorer/ocs-build
      - uses: actions/download-artifact@v4
        with:
          name: browser-wasm
          path: format-explorer/wasm-build
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install website test tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python-is-python3 zstd
      - name: Check website and deployment recovery
        run: |
          test -s format-explorer/ocs-build/index.html
          test -n "$(find format-explorer/ocs-build -name '*.wasm' -print -quit)"
          test -s format-explorer/wasm-build/browser_bg.wasm
          bash -n format-explorer/deploy/release.sh
          npm --prefix format-explorer test
          npm --prefix format-explorer run build
          test -s format-explorer/dist/wasm/browser_bg.wasm
          test -s format-explorer/dist/ocs/app/index.html
          test -s format-explorer/dist/ocs/app/LICENSE
      - name: Assemble and exercise release
        shell: bash
        env:
          PUBLIC_ORIGIN: https://ifccad-explorer.open-aec.com
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/explorer-release"
          mkdir -p "$release/deploy" "$release/src"
          cp -R format-explorer/dist format-explorer/scripts "$release/"
          cp format-explorer/src/cad-formats.mjs "$release/src/"
          cp format-explorer/deploy/container.mjs "$release/"
          cp format-explorer/deploy/smoke.mjs "$release/deploy/"
          cp LICENSE "$release/"
          node -e 'require("fs").writeFileSync(process.argv[1],JSON.stringify({revision:process.env.GITHUB_SHA,builtAt:new Date().toISOString()}))' "$release/dist/version.json"
          node "$release/container.mjs" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          node "$release/deploy/smoke.mjs" http://127.0.0.1:4183 "$GITHUB_SHA"
          tar -czf "$RUNNER_TEMP/explorer.tar.gz" -C "$release" .
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-release
          path: ${{ runner.temp }}/explorer.tar.gz
          retention-days: 7

  ci:
    name: CAD Format Explorer checks
    needs: [checks, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to succeed
        env:
          RUST_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$BUILD_RESULT" = success

  deploy:
    needs: [ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: format-explorer-production
      url: https://ifccad-explorer.open-aec.com
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '167.235.54.105' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: explorer-release
          path: ${{ runner.temp }}
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          log-public-key: false
      - name: Deploy tested release with rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          cat format-explorer/deploy/known_hosts >> ~/.ssh/known_hosts
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          checksum=$(sha256sum "$RUNNER_TEMP/explorer.tar.gz" | cut -d ' ' -f 1)
          ssh "${ssh_args[@]}" -p "$DEPLOY_PORT" "$target" 'mkdir -p /opt/ifccad-explorer/incoming'
          scp "${ssh_args[@]}" -P "$DEPLOY_PORT" "$RUNNER_TEMP/explorer.tar.gz" "$target:/opt/ifccad-explorer/incoming/$release.tar.gz"
          ssh "${ssh_args[@]}" -p "$DEPLOY_PORT" "$target" "bash -s -- '$release' '$checksum'" < format-explorer/deploy/release.sh
      - name: Verify public HTTPS website
        run: node format-explorer/deploy/smoke.mjs https://ifccad-explorer.open-aec.com "$GITHUB_SHA" public
