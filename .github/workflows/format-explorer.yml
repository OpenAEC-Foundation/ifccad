name: Deploy format explorer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-explorer-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '167.235.54.105' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin existing OpenAEC SSH host
        run: |
          mkdir -p ~/.ssh
          cat format-explorer/deploy/known_hosts >> ~/.ssh/known_hosts
      - name: Inspect existing explorer service (read only)
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < format-explorer/deploy/inspect.sh
