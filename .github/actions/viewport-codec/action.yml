name: Prepare viewport codec
description: Select the pinned unmodified codec
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: HakanSeven12/opencadcodec
        ref: bd10efc2c54dfe1e6288c5f10486dce9be0d7f32
        path: .superpowers/dependencies/opencadcodec-viewports-development
        persist-credentials: false
    - name: Select unmodified codec
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .cargo
        cp patches/opencadcodec-viewports.toml .cargo/config.toml
