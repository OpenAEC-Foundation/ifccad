name: Prepare viewport codec
description: Select the pinned codec base with the remaining explicit viewport-off repair
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: HakanSeven12/opencadcodec
        ref: ab2eecdbffc31120b5ad6d899f6fc67cf21ede39
        path: .superpowers/dependencies/opencadcodec-viewports-development
        persist-credentials: false
    - name: Apply and select viewport repairs
      shell: bash
      run: |
        set -euo pipefail
        codec=.superpowers/dependencies/opencadcodec-viewports-development
        for patch in 0003-viewport-off-state.patch; do
          git -C "$codec" apply --check "../../../patches/opencadcodec-viewports/$patch"
          git -C "$codec" apply "../../../patches/opencadcodec-viewports/$patch"
        done
        mkdir -p .cargo
        cp patches/opencadcodec-viewports.toml .cargo/config.toml
