[package]
name = "ocdraw"
version = "0.1.0"
edition = "2021"
description = "Open CAD Drawing information model and exchange format"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"
homepage = "https://github.com/OpenAEC-Foundation/ifccad"
documentation = "https://docs.rs/ocdraw"
readme = "README.md"
keywords = ["cad", "drawing", "ocdraw", "exchange", "conformance"]
categories = ["parser-implementations", "encoding"]

[workspace]
members = ["crates/ocdraw-convert", "crates/ocdraw-viewer", "crates/ocdraw-browser"]
resolver = "2"

[features]
default = []

[dependencies]
fpmath = "=0.1.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
jsonschema = { version = "0.49", default-features = false }
thiserror = "1.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
