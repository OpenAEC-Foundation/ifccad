[package]
name = "ifccad"
version = "0.1.0"
edition = "2021"
description = "Rust implementation and language-neutral format contract for IFCCAD"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"
homepage = "https://github.com/OpenAEC-Foundation/ifccad"
documentation = "https://docs.rs/ifccad"
readme = "README.md"
keywords = ["cad", "ifc", "ifccad", "bim", "conformance"]
categories = ["parser-implementations", "encoding"]

[workspace]
members = ["crates/ifccad-convert"]
resolver = "2"

[features]
default = []

[dependencies]
jsonschema = { version = "0.49", default-features = false }
thiserror = "1.0"
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
