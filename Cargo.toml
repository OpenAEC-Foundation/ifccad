[package]
name = "ifccad"
version.workspace = true
edition = "2021"
description = "IFCCAD drawing model with IFCX JSON and CBOR encodings"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"
homepage = "https://github.com/OpenAEC-Foundation/ifccad"
documentation = "https://docs.rs/ifccad"
readme = "README.md"
keywords = ["cad", "drawing", "ifccad", "exchange", "conformance"]
categories = ["parser-implementations", "encoding"]

include = ["/src/**", "/schemas/**", "/tests/**", "/conformance/next/**", "/examples/*.rs", "/examples/ifccad/**", "/README.md", "/LICENSE", "/Cargo.toml", "/rust-toolchain.toml", "/release/manifest.json", "/docs/alpha-compatibility.md", "/docs/releases.md", "/docs/releases/**"]

[workspace.package]
version = "2026.44.0"

# The shared Document converter and the browser use one IFCCAD model identity.
[patch."https://github.com/OpenAEC-Foundation/ifccad.git"]
ifccad = { path = "." }

[workspace]
members = ["crates/viewer", "crates/browser"]
resolver = "2"
exclude = ["legacy/ifccad-convert", "legacy/ocdraw", "legacy/ocdraw/crates/ocdraw-convert"]

[features]
default = []
ifccad-cbor-zstd = ["dep:zstd"]

[dependencies]
minicbor = { version = "=2.3.0", features = ["std"] }
zstd = { version = "=0.13.3", default-features = false, optional = true }
base64 = "0.22"
fpmath = "=0.1.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
jsonschema = { version = "0.49", default-features = false }
thiserror = "1.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
