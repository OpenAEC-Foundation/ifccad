[package]
name = "ifccad"
version = "0.1.0"
edition = "2021"
description = "IFCCAD drawing model with IFCX JSON and CBOR encodings"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"
homepage = "https://github.com/OpenAEC-Foundation/ifccad"
documentation = "https://docs.rs/ifccad"
readme = "README.md"
keywords = ["cad", "drawing", "ifccad", "exchange", "conformance"]
categories = ["parser-implementations", "encoding"]

[workspace]
members = ["crates/cad-preservation", "crates/cad-workspace-convert", "crates/cad-geometry-convert", "crates/cad-presentation-convert", "crates/cad-text", "crates/cad-dimension", "crates/viewer", "crates/browser", "crates/ifccad-convert"]
resolver = "2"
exclude = ["legacy/ocdraw", "legacy/ocdraw/crates/ocdraw-convert"]

[features]
default = []
ifccad-cbor-zstd = ["dep:zstd"]

[dependencies]
minicbor = { version = "=2.3.0", features = ["std"] }
zstd = { version = "=0.13.3", default-features = false, optional = true }
base64 = "0.22"
fpmath = "=0.1.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
jsonschema = { version = "0.49", default-features = false }
thiserror = "1.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
