[package]
name = "ifccad-convert"
version = "0.1.0"
edition = "2021"
description = "Conversion between validated IFCCAD drawings and cadcodec CadDocument"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"

[dependencies]
fpmath = "=0.1.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
ifccad = { path = "../.." }
cadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/cadcodec.git", rev = "5b682ed66ea2c89be8142c8dd83d83774fc3de08" }
thiserror = "1.0"

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "size_baseline"
test = true
