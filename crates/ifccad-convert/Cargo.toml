[package]
name = "ifccad-convert"
version = "0.1.0"
edition = "2021"
description = "Conversion between validated IFCCAD drawings and cadcodec CadDocument"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"

[dependencies]
ifccad = { path = "../.." }
cadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/cadcodec.git", rev = "2f2cd25832db298524fb5eb36ced5a438a877e95" }
thiserror = "1.0"

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "size_baseline"
test = true
