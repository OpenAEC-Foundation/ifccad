[package]
name = "ifccad-convert"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Experimental exact IFCCAD and CadDocument conversion"

[features]
ifccad-cbor-zstd = ["ifccad/ifccad-cbor-zstd"]

[dependencies]
cad-dimension = { path = "../cad-dimension" }
cad-presentation-convert = { path = "../cad-presentation-convert" }
cad-text = { path = "../cad-text" }
cad-preservation = { path = "../cad-preservation" }
cad-workspace-convert = { path = "../cad-workspace-convert" }
cad-geometry-convert = { path = "../cad-geometry-convert" }
ifccad = { path = "../.." }
opencadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "bd10efc2c54dfe1e6288c5f10486dce9be0d7f32", features = ["serde"] }
serde = "1"
serde_json = "1"
sha2 = "=0.10.9"
num-rational = "0.4"
thiserror = "1"
