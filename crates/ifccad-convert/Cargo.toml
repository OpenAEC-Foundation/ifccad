[package]
name = "ifccad-convert"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Experimental exact IFCCAD and CadDocument conversion"

[dependencies]
cad-text = { path = "../cad-text" }
cad-preservation = { path = "../cad-preservation" }
cad-workspace-convert = { path = "../cad-workspace-convert" }
cad-geometry-convert = { path = "../cad-geometry-convert" }
ocdraw = { path = "../.." }
opencadcodec = { package = "opencadcodec", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "ab2eecdbffc31120b5ad6d899f6fc67cf21ede39", features = ["serde"] }
serde = "1"
serde_json = "1"
num-rational = "0.4"
thiserror = "1"
