[package]
name = "ifccad-convert"
version = "0.1.0"
edition = "2021"
description = "Conversion between validated IFCCAD drawings and cadcodec CadDocument"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"

[dependencies]
ifccad = { path = "../.." }
cadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/cadcodec.git", rev = "a0f7d444f1607bc4b2c881060cbe7ea1014253cb" }
thiserror = "1.0"
