[package]
name = "viewer"
version.workspace = true
publish = false
edition = "2021"
license = "MPL-2.0"
description = "Local application adapter for IFCCAD"

[features]
default = []
ifccad-cbor-zstd = ["ifccad/ifccad-cbor-zstd"]

[dependencies]
opencaddocument = { git = "https://github.com/BjornFidder/opencaddocument.git", rev = "6fcede024604a91a8490bafaf7e2b99467eca7aa", features = ["ifcx"] }
serde = { version = "1", features = ["derive"] }
ifccad = { path = "../.." }
serde_json = "1"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
