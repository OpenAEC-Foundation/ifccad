[package]
name = "viewer"
version.workspace = true
publish = false
edition = "2021"
license = "MPL-2.0"
description = "Local application adapter for IFCCAD"

[features]
default = []
ifccad-cbor-zstd = ["ifccad/ifccad-cbor-zstd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ifccad = { path = "../.." }
ifccad-convert = { path = "../ifccad-convert" }
serde_json = "1"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
