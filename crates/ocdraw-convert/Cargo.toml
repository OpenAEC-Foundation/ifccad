[package]
name = "ocdraw-convert"
version = "0.1.0"
edition = "2021"
description = "Conversion between OCDraw drawings and cadcodec CadDocument"
license = "MPL-2.0"
repository = "https://github.com/OpenAEC-Foundation/ifccad"

[dependencies]
fpmath = "=0.1.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
ocdraw = { path = "../.." }
cadcodec = { package = "opencadcodec", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "d96e3fa2fe5acbeac966f1db4c01142618bf9c79" }
thiserror = "1.0"
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "size_baseline"
test = true
