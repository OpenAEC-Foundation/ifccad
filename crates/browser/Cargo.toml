[package]
name = "browser"
version.workspace = true
publish = false
edition = "2021"
license = "MPL-2.0"
description = "Byte-oriented WebAssembly adapter for IFCCAD"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
viewer = { path = "../viewer", features = ["ifccad-cbor-zstd"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
