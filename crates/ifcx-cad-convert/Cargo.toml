[package]
name = "ifcx-cad-convert"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Experimental exact IFCX-CAD and CadDocument conversion"

[dependencies]
ocdraw = { path = "../.." }
opencadcodec = { package = "opencadcodec", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "fe69506cb99dea6f4c4a73b690a27fdf04403ea0", features = ["serde"] }
serde = "1"
serde_json = "1"
num-rational = "0.4"
thiserror = "1"
