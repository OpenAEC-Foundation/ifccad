[package]
name = "ifcx-cad-convert"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Experimental exact IFCX-CAD and CadDocument conversion"

[dependencies]
ocdraw = { path = "../.." }
cadcodec = { package = "opencadcodec", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "d96e3fa2fe5acbeac966f1db4c01142618bf9c79", features = ["serde"] }
serde = "1"
serde_json = "1"
num-rational = "0.4"
thiserror = "1"
