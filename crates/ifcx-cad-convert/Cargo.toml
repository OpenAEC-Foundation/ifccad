[package]
name = "ifcx-cad-convert"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Experimental exact IFCX-CAD and CadDocument conversion"

[dependencies]
ocdraw = { path = "../.." }
cadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/cadcodec.git", rev = "5b682ed66ea2c89be8142c8dd83d83774fc3de08", features = ["serde"] }
serde = "1"
serde_json = "1"
num-rational = "0.4"
thiserror = "1"
