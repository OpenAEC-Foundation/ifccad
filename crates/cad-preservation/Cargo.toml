[package]
name = "cad-preservation"
version = "0.1.0"
edition = "2021"
description = "Audited codec-specific CAD source snapshots"
license = "MPL-2.0"
[dependencies]
opencadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "bd10efc2c54dfe1e6288c5f10486dce9be0d7f32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
