[package]
name = "cad-text"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Shared typed CAD text content and placement preparation"

[dependencies]
ifccad = { path = "../.." }
cad-geometry-convert = { path = "../cad-geometry-convert" }
opencadcodec = { package = "acadrust", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "bd10efc2c54dfe1e6288c5f10486dce9be0d7f32" }
num-rational = "0.4"
num-traits = "0.2"
thiserror = "1"

[dev-dependencies]
serde_json = "1"
